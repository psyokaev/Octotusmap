# Giao diện giống bản React cũ (frontend/tailwind.config.js, src/index.css)
[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showSidebarNavigation = false

[theme]
# chỉ giao diện sáng như bản React (không theo chế độ tối của hệ điều hành)
base = "light"
backgroundColor = "#F5F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2B36"
borderColor = "#DBE3E9"
linkColor = "#1C7CB5"
primaryColor = "#1C7CB5"
font = "'Google Sans', Roboto, Arial, sans-serif"
headingFont = "'Google Sans', Roboto, Arial, sans-serif"
headingFontSizes = ["1.375rem", "1.125rem", "1rem"]
headingFontWeights = [600, 600, 600]
baseFontSize = 15
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
redColor = "#C62828"
orangeColor = "#D99A00"
greenColor = "#2E8B57"
blueColor = "#1C7CB5"
chartCategoricalColors = ["#1C7CB5", "#C62828", "#2E8B57", "#D99A00", "#24506B", "#8A949C"]
