[project]
name = "urban-flood-dss"
version = "1.0.0"
description = "Hệ thống hỗ trợ ra quyết định cảnh báo sớm ngập úng đô thị TP.HCM"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["db: cần MySQL", "slow: huấn luyện mô hình"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E731"]
