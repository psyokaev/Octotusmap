server {
  listen 80;
  root /usr/share/nginx/html;
  # ghi đè header để client không giả được IP; backend giới hạn tần suất theo IP này
  location /api/ { proxy_pass http://backend:8000; proxy_set_header X-Forwarded-For $remote_addr; proxy_buffering off; proxy_read_timeout 3600s; }
  location /health { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
